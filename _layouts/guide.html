<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | escape }}</title>
    <style>
      :root { color: #1f2937; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; background: #ffffff; line-height: 1.55; }
      main { box-sizing: border-box; margin: 0 auto; max-width: 960px; padding: 2rem 1.25rem 4rem; }
      h1, h2, h3 { color: #111827; line-height: 1.25; }
      h2 { border-bottom: 1px solid #d1d5db; margin-top: 2.5rem; padding-bottom: 0.35rem; }
      a { color: #0969da; }
      img { height: auto; max-width: 100%; }
      table { border-collapse: collapse; display: block; max-width: 100%; overflow-x: auto; }
      th, td { border: 1px solid #d1d5db; padding: 0.55rem 0.7rem; text-align: left; vertical-align: top; }
      th { background: #f3f4f6; }
      pre { background: #f6f8fa; border-radius: 6px; overflow-x: auto; padding: 1rem; }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      :not(pre) > code { background: #f3f4f6; border-radius: 4px; padding: 0.1rem 0.25rem; }
      blockquote { border-left: 4px solid #60a5fa; color: #374151; margin-left: 0; padding-left: 1rem; }
    </style>
  </head>
  <body>
    <main>
      {{ content }}
    </main>
  </body>
</html>
