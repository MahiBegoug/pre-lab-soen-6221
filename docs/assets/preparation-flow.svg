<!-- Hand-authored SVG diagram. It has no generated-image or JavaScript dependency. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 844" role="img" aria-labelledby="title description">
  <title id="title">Pre-lab preparation flow</title>
  <desc id="description">A seven-step flow from installing local tools to the final readiness check.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .heading { font: 700 20px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0f172a; }
      .detail { font: 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #334155; }
      .arrow { stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <path class="arrow" d="M400 104 V128"/>
  <path class="arrow" d="M400 222 V246"/>
  <path class="arrow" d="M400 340 V364"/>
  <path class="arrow" d="M400 458 V482"/>
  <path class="arrow" d="M400 576 V600"/>
  <path class="arrow" d="M400 694 V718"/>

  <rect x="30" y="16" width="740" height="88" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="51" class="heading">(1) Install local tools</text>
  <text x="60" y="78" class="detail">Install Git, Python, and Docker. Confirm each works in your terminal.</text>

  <rect x="30" y="134" width="740" height="88" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="60" y="169" class="heading">(2) Prepare a small Python environment</text>
  <text x="60" y="196" class="detail">Use it only for the pre-lab connection checks.</text>

  <rect x="30" y="252" width="740" height="88" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="60" y="287" class="heading">(3) Choose one vibe-coding assistant</text>
  <text x="60" y="314" class="detail">Use Codex, Claude Code, or Cursor.</text>

  <rect x="30" y="370" width="740" height="88" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="60" y="405" class="heading">(4) Test a repair-model route</text>
  <text x="60" y="432" class="detail">Prefer Ollama with Qwen; use one cloud API only when needed.</text>

  <rect x="30" y="488" width="740" height="88" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="60" y="523" class="heading">(5) Test a restricted GitHub token</text>
  <text x="60" y="550" class="detail">Prepare the bounded code-research connection.</text>

  <rect x="30" y="606" width="740" height="88" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="60" y="641" class="heading">(6) Test Langfuse Cloud</text>
  <text x="60" y="668" class="detail">Prepare the repair-trajectory connection.</text>

  <rect x="30" y="724" width="740" height="88" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="60" y="759" class="heading">(7) Final readiness check</text>
  <text x="60" y="786" class="detail">Arrive with the tools, accounts, and connections ready.</text>
</svg>
